<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s_pattern_generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background-color 0.4s ease;
    }
    body.paper-mode {
      background-color: #e8e6df;
      color: #1a1a1a;
    }
    #canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 90vw;
      height: 85vh;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      border-radius: 8px;
      background: transparent;
    }
    
    /* Hover-to-reveal floating controls bar */
    .controls-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-bottom: 20px;
      padding-top: 30px; /* Expands hover capture zone */
      z-index: 100;
      transform: translateY(calc(100% - 15px)); /* Leave small trigger area visible at bottom edge */
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .controls-wrapper:hover,
    .controls-wrapper.visible {
      transform: translateY(0);
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(20, 20, 30, 0.88);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    body.paper-mode .controls {
      background: rgba(230, 225, 215, 0.92);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    button, label, select {
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button, select {
      background: #45a29e;
      color: #0b0c10;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      outline: none;
    }
    button:hover, select:hover {
      background: #66fcf1;
      transform: translateY(-1px);
    }
    select {
      padding-right: 8px;
    }
    input[type=range] {
      vertical-align: middle;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="diagramCanvas" width="900" height="900"></canvas>
  </div>

  <div class="controls-wrapper" id="controlsWrapper">
    <div class="controls">
      <button id="btnGenerate">Generate New</button>
      <label>
        Flash Interval:
        <input type="range" id="speedRange" min="0.2" max="5.0" step="0.1" value="2.0">
        <span id="speedVal">2.0s</span>
      </label>
      <label>
        <input type="checkbox" id="pauseToggle"> Pause Flashing
      </label>
      <label>
        Palette:
        <select id="colorPalette">
          <option value="monochrome">Monochrome</option>
          <option value="rainbow">Rainbow Flash</option>
          <option value="cyan">Neon Cyan</option>
          <option value="gold">Ancient Gold</option>
          <option value="matrix">Matrix Green</option>
        </select>
      </label>
      <button id="btnTheme">Toggle Paper Mode</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('diagramCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Controls
    const btnGenerate = document.getElementById('btnGenerate');
    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    const pauseToggle = document.getElementById('pauseToggle');
    const btnTheme = document.getElementById('btnTheme');
    const colorPalette = document.getElementById('colorPalette');
    const controlsWrapper = document.getElementById('controlsWrapper');

    let flashTimer = null;
    let autoHideTimer = null;
    let isPaperMode = false;

    // Helper functions
    const rand = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));
    const randChoice = arr => arr[Math.floor(Math.random() * arr.length)];
    const coinFlip = (prob = 0.5) => Math.random() < prob;

    function getStrokeColor() {
      const palette = colorPalette.value;
      if (palette === 'rainbow') {
        // Generate vivid rainbow color (0 to 360 deg hue)
        // Saturation set high (85-100%) to avoid greys/blacks
        // Lightness tuned to prevent dark colors, blacks, or dark browns
        const hue = randInt(0, 360);
        const sat = randInt(85, 100);
        const light = isPaperMode ? randInt(25, 45) : randInt(55, 75);
        return `hsl(${hue}, ${sat}%, ${light}%)`;
      }

      if (isPaperMode) {
        switch (palette) {
          case 'cyan': return '#005f73';
          case 'gold': return '#8b5e3c';
          case 'matrix': return '#1b4332';
          default: return '#222225';
        }
      } else {
        switch (palette) {
          case 'cyan': return '#66fcf1';
          case 'gold': return '#ffd700';
          case 'matrix': return '#00ff66';
          default: return '#e0e6ed';
        }
      }
    }

    // Auto-hide bottom bar controls
    function showControlsTemporarily() {
      controlsWrapper.classList.add('visible');
      clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(() => {
        controlsWrapper.classList.remove('visible');
      }, 2500);
    }

    window.addEventListener('mousemove', (e) => {
      // Reveal if cursor moves in lower quarter of screen
      if (e.clientY > window.innerHeight * 0.75) {
        showControlsTemporarily();
      }
    });

    controlsWrapper.addEventListener('mouseenter', () => {
      clearTimeout(autoHideTimer);
      controlsWrapper.classList.add('visible');
    });

    controlsWrapper.addEventListener('mouseleave', () => {
      autoHideTimer = setTimeout(() => {
        controlsWrapper.classList.remove('visible');
      }, 1000);
    });

    // Main Draw Function
    function generateDiagram() {
      const w = canvas.width;
      const h = canvas.height;
      const center = { x: w / 2, y: h / 2 };
      const baseRadius = Math.min(w, h) * 0.22;

      ctx.clearRect(0, 0, w, h);
      
      const strokeColor = getStrokeColor();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = strokeColor;
      ctx.fillStyle = strokeColor;
      ctx.lineCap = 'round';

      // 1. Central Core Archetype
      const coreType = randChoice(['concentric', 'eye', 'triangle', 'spiral']);
      
      // Draw primary main ring
      ctx.beginPath();
      ctx.arc(center.x, center.y, baseRadius, 0, Math.PI * 2);
      ctx.stroke();

      if (coreType === 'concentric') {
        ctx.beginPath();
        ctx.arc(center.x, center.y, baseRadius * 0.65, 0, Math.PI * 2);
        ctx.stroke();
        if (coinFlip(0.7)) {
          ctx.beginPath();
          ctx.arc(center.x, center.y, baseRadius * 0.35, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else if (coreType === 'eye') {
        // Vesica Piscis / Eye shape
        const r = baseRadius * 0.8;
        ctx.beginPath();
        ctx.arc(center.x - r * 0.5, center.y, r, -Math.PI / 3, Math.PI / 3);
        ctx.arc(center.x + r * 0.5, center.y, r, Math.PI * 2 / 3, Math.PI * 4 / 3);
        ctx.closePath();
        ctx.stroke();

        // Eye Pupil
        ctx.beginPath();
        ctx.ellipse(center.x, center.y, r * 0.12, r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (coreType === 'triangle') {
        // Inscribed Triangle
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const a = (i * 2 * Math.PI / 3) - Math.PI / 2;
          const x = center.x + Math.cos(a) * baseRadius;
          const y = center.y + Math.sin(a) * baseRadius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();

        // Inner circle
        ctx.beginPath();
        ctx.arc(center.x, center.y, baseRadius * 0.3, 0, Math.PI * 2);
        ctx.stroke();
      } else if (coreType === 'spiral') {
        // Logarithmic / Archimedean Spiral
        ctx.beginPath();
        const a = 2, b = 6;
        for (let theta = 0; theta < Math.PI * 5; theta += 0.1) {
          const r = a + b * theta;
          const x = center.x + r * Math.cos(theta);
          const y = center.y + r * Math.sin(theta);
          if (theta === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // 2. Linear Axis & Bisecting Lines
      const numSpokes = randInt(2, 5);
      const spokeAngles = [];
      for (let i = 0; i < numSpokes; i++) {
        const angle = rand(0, Math.PI * 2);
        spokeAngles.push(angle);
        const len = baseRadius * rand(1.8, 2.5);
        
        ctx.beginPath();
        ctx.moveTo(
          center.x - Math.cos(angle) * (len * rand(0.3, 0.8)),
          center.y - Math.sin(angle) * (len * rand(0.3, 0.8))
        );
        ctx.lineTo(
          center.x + Math.cos(angle) * len,
          center.y + Math.sin(angle) * len
        );
        ctx.stroke();

        // Terminal T-bar or cap
        if (coinFlip(0.6)) {
          const endX = center.x + Math.cos(angle) * len;
          const endY = center.y + Math.sin(angle) * len;
          const perpAngle = angle + Math.PI / 2;
          const barLen = rand(15, 30);

          ctx.beginPath();
          ctx.moveTo(endX - Math.cos(perpAngle) * barLen, endY - Math.sin(perpAngle) * barLen);
          ctx.lineTo(endX + Math.cos(perpAngle) * barLen, endY + Math.sin(perpAngle) * barLen);
          ctx.stroke();
          
          if (coinFlip(0.4)) { // Parallel bar
            const offset = 6;
            const ox = Math.cos(angle) * offset;
            const oy = Math.sin(angle) * offset;
            ctx.beginPath();
            ctx.moveTo(endX + ox - Math.cos(perpAngle) * barLen, endY + oy - Math.sin(perpAngle) * barLen);
            ctx.lineTo(endX + ox + Math.cos(perpAngle) * barLen, endY + oy + Math.sin(perpAngle) * barLen);
            ctx.stroke();
          }
        }
      }

      // 3. Orbital Circles Intersecting Core / Spokes
      const numSatellites = randInt(3, 7);
      for (let i = 0; i < numSatellites; i++) {
        const orbitAngle = rand(0, Math.PI * 2);
        const dist = baseRadius * rand(0.7, 1.8);
        const satRadius = rand(18, 55);
        const sx = center.x + Math.cos(orbitAngle) * dist;
        const sy = center.y + Math.sin(orbitAngle) * dist;

        // Satellite Circle
        ctx.beginPath();
        ctx.arc(sx, sy, satRadius, 0, Math.PI * 2);
        ctx.stroke();

        // Inner detail inside satellite circle
        if (coinFlip(0.7)) {
          const subType = randChoice(['concentric', 'bisection', 'inner-circle']);
          if (subType === 'concentric') {
            ctx.beginPath();
            ctx.arc(sx, sy, satRadius * 0.5, 0, Math.PI * 2);
            ctx.stroke();
          } else if (subType === 'bisection') {
            const cutA = rand(0, Math.PI * 2);
            ctx.beginPath();
            ctx.moveTo(sx - Math.cos(cutA) * satRadius, sy - Math.sin(cutA) * satRadius);
            ctx.lineTo(sx + Math.cos(cutA) * satRadius, sy + Math.sin(cutA) * satRadius);
            ctx.stroke();
          } else if (subType === 'inner-circle') {
            ctx.beginPath();
            ctx.arc(sx + satRadius * 0.3, sy, satRadius * 0.4, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      // 4. Concentric Outer Arcs
      const numArcs = randInt(3, 8);
      for (let i = 0; i < numArcs; i++) {
        const r = baseRadius * rand(1.1, 2.2);
        const startA = rand(0, Math.PI * 2);
        const arcLength = rand(Math.PI * 0.2, Math.PI * 0.9);
        
        ctx.beginPath();
        ctx.arc(center.x, center.y, r, startA, startA + arcLength);
        ctx.stroke();

        // Arc glyph labels
        if (coinFlip(0.6)) {
          drawGlyphStringOnArc(center.x, center.y, r + randChoice([-14, 14]), startA, startA + arcLength * 0.8);
        }
      }

      // 5. Small Node Constellations
      const numConstellations = randInt(2, 5);
      for (let c = 0; c < numConstellations; c++) {
        const cx = center.x + rand(-baseRadius * 1.8, baseRadius * 1.8);
        const cy = center.y + rand(-baseRadius * 1.8, baseRadius * 1.8);
        
        // Triple dot cluster
        if (coinFlip(0.5)) {
          const dotR = 3.5;
          for (let d = 0; d < 3; d++) {
            const da = (d * Math.PI * 2 / 3);
            ctx.beginPath();
            ctx.arc(cx + Math.cos(da) * 12, cy + Math.sin(da) * 12, dotR, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else {
          // Connected node chain
          let nx = cx, ny = cy;
          const chainLen = randInt(2, 4);
          for (let k = 0; k < chainLen; k++) {
            ctx.beginPath();
            ctx.arc(nx, ny, rand(4, 7), 0, Math.PI * 2);
            ctx.stroke();

            const nextX = nx + rand(-35, 35);
            const nextY = ny + rand(-35, 35);

            ctx.beginPath();
            ctx.moveTo(nx, ny);
            ctx.lineTo(nextX, nextY);
            ctx.stroke();

            nx = nextX;
            ny = nextY;
          }
        }
      }

      // 6. Free-Floating Linear Glyph Blocks
      const numBlocks = randInt(2, 4);
      for (let b = 0; b < numBlocks; b++) {
        const bx = center.x + rand(-baseRadius * 1.6, baseRadius * 1.6);
        const by = center.y + rand(-baseRadius * 1.6, baseRadius * 1.6);
        drawGlyphBlock(bx, by, randInt(2, 5), randInt(4, 8));
      }
    }

    // Pseudo Gallifreyan / Alien Runes Rendering
    function drawGlyphSymbol(x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      const hSize = size / 2;

      const pattern = randInt(0, 5);
      ctx.lineWidth = 1.2;

      if (pattern === 0) {
        ctx.strokeRect(-hSize, -hSize, size, size);
        ctx.fillRect(-2, -2, 4, 4);
      } else if (pattern === 1) {
        ctx.beginPath();
        ctx.moveTo(-hSize, 0); ctx.lineTo(hSize, 0);
        ctx.moveTo(0, -hSize); ctx.lineTo(0, hSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-hSize/2, -hSize/2, 2, 0, Math.PI*2);
        ctx.arc(hSize/2, hSize/2, 2, 0, Math.PI*2);
        ctx.fill();
      } else if (pattern === 2) {
        ctx.beginPath();
        ctx.moveTo(-hSize, -hSize); ctx.lineTo(hSize, hSize);
        ctx.moveTo(-hSize, hSize); ctx.lineTo(0, 0);
        ctx.stroke();
      } else if (pattern === 3) {
        ctx.beginPath();
        ctx.arc(0, 0, hSize * 0.7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillRect(-1, -1, 2, 2);
      } else {
        ctx.beginPath();
        ctx.moveTo(-hSize, -hSize); ctx.lineTo(hSize, -hSize);
        ctx.moveTo(0, -hSize); ctx.lineTo(0, hSize);
        ctx.stroke();
        ctx.fillRect(-hSize, hSize - 2, 4, 4);
      }

      ctx.restore();
    }

    function drawGlyphStringOnArc(cx, cy, radius, startAngle, endAngle) {
      const arcLen = (endAngle - startAngle) * radius;
      const step = 14; 
      const count = Math.floor(arcLen / step);
      const angleStep = (endAngle - startAngle) / count;

      for (let i = 0; i < count; i++) {
        const angle = startAngle + i * angleStep;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        drawGlyphSymbol(x, y, 8);
      }
    }

    function drawGlyphBlock(x, y, rows, cols) {
      const step = 12;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (coinFlip(0.85)) {
            drawGlyphSymbol(x + c * step, y + r * step, 7);
          }
        }
      }
    }

    // Interval Control
    function resetTimer() {
      if (flashTimer) clearInterval(flashTimer);
      if (!pauseToggle.checked) {
        const interval = parseFloat(speedRange.value) * 1000;
        flashTimer = setInterval(generateDiagram, interval);
      }
    }

    // Event Listeners
    btnGenerate.addEventListener('click', generateDiagram);

    speedRange.addEventListener('input', (e) => {
      speedVal.textContent = parseFloat(e.target.value).toFixed(1) + 's';
      resetTimer();
    });

    pauseToggle.addEventListener('change', resetTimer);

    colorPalette.addEventListener('change', generateDiagram);

    btnTheme.addEventListener('click', () => {
      isPaperMode = !isPaperMode;
      document.body.classList.toggle('paper-mode', isPaperMode);
      generateDiagram();
    });

    // Initial Start
    generateDiagram();
    resetTimer();
    showControlsTemporarily();
  </script>
</body>
</html>
