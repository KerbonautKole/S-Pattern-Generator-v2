<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s_pattern_generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background-color 0.4s ease;
    }
    body.paper-mode {
      background-color: #f7f5ef;
      background-image: linear-gradient(to bottom, transparent 29px, #bde0fe 29px, #bde0fe 30px);
      background-size: 100% 30px;
      color: #1b3152;
    }
    #canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 90vw;
      height: 85vh;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      border-radius: 8px;
      background: transparent;
      cursor: crosshair;
      background-color: transparent !important;
    }
    
    .controls-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-bottom: 20px;
      padding-top: 30px; 
      z-index: 100;
      transform: translateY(calc(100% - 15px)); 
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .controls-wrapper:hover,
    .controls-wrapper.visible {
      transform: translateY(0);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 30, 0.88);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 95vw;
    }
    body.paper-mode .controls {
      background: rgba(230, 225, 215, 0.92);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    button, label, select {
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button, select {
      background: #45a29e;
      color: #0b0c10;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      outline: none;
    }
    button:hover, select:hover {
      background: #66fcf1;
      transform: translateY(-1px);
    }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }
    select {
      padding-right: 8px;
    }
    input[type=range], input[type=checkbox] {
      vertical-align: middle;
      cursor: pointer;
    }
    
    #btnStartNodes {
      background: #00ff66;
      display: none;
    }
    #btnStartNodes:hover {
      background: #66ff99;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="diagramCanvas" width="900" height="900"></canvas>
  </div>

  <div class="controls-wrapper" id="controlsWrapper">
    <div class="controls">
      <button id="btnGenerate">Generate New</button>
      
      <label>
        Mode:
        <select id="modeSelect">
          <option value="center">Start from Center</option>
          <option value="1">1 Node</option>
          <option value="2">2 Nodes</option>
          <option value="3">3 Nodes</option>
          <option value="4">4 Nodes</option>
          <option value="5">5 Nodes</option>
        </select>
      </label>

      <button id="btnStartNodes">Start Connect</button>

      <label>
        <input type="checkbox" id="animToggle" checked> Animate Nanobots
      </label>

      <label class="timer-control">
        Interval:
        <input type="range" id="speedRange" min="2.0" max="10.0" step="0.5" value="4.0">
        <span id="speedVal">4.0s</span>
      </label>
      <label class="timer-control">
        <input type="checkbox" id="pauseToggle"> Pause Timer
      </label>
      
      <label>
        Palette:
        <select id="colorPalette">
          <option value="monochrome">Monochrome</option>
          <option value="rainbow">Rainbow Flash</option>
          <option value="cyan">Neon Cyan</option>
          <option value="gold">Ancient Gold</option>
          <option value="matrix">Matrix Green</option>
        </select>
      </label>
      <button id="btnTheme">Toggle Paper</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('diagramCanvas');
    const mainCtx = canvas.getContext('2d');
    
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');
    
    const btnGenerate = document.getElementById('btnGenerate');
    const btnStartNodes = document.getElementById('btnStartNodes');
    const modeSelect = document.getElementById('modeSelect');
    const animToggle = document.getElementById('animToggle');
    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    const pauseToggle = document.getElementById('pauseToggle');
    const btnTheme = document.getElementById('btnTheme');
    const colorPalette = document.getElementById('colorPalette');
    const controlsWrapper = document.getElementById('controlsWrapper');
    const timerControls = document.querySelectorAll('.timer-control');

    let flashTimer = null;
    let autoHideTimer = null;
    let isPaperMode = false;
    
    let animFrame = null;
    let activeBots = [];
    let sortedSegments = [];
    let currentIndex = 0;
    let currentCtx = null;
    
    let clickedPoints = [];

    class FakeCtx {
      constructor() {
        this.segments = [];
        this.lineWidth = 1.8;
        this.strokeStyle = '#fff';
        this.fillStyle = '#fff';
        this.lineCap = 'round';
        this.subpaths = [];
        this.currPath = [];
        this.state = { tx: 0, ty: 0 };
        this.stack = [];
      }
      
      save() { this.stack.push({ tx: this.state.tx, ty: this.state.ty }); }
      restore() { if(this.stack.length > 0) this.state = this.stack.pop(); }
      translate(x, y) { this.state.tx += x; this.state.ty += y; }
      _x(x) { return x + this.state.tx; }
      _y(y) { return y + this.state.ty; }

      beginPath() {
        this.subpaths = [];
        this.currPath = [];
      }
      moveTo(x, y) {
        if(this.currPath.length > 0) this.subpaths.push(this.currPath);
        this.currPath = [{x: this._x(x), y: this._y(y)}];
      }
      lineTo(x, y) {
        if(this.currPath.length === 0) this.currPath.push({x: this._x(x), y: this._y(y)});
        this.currPath.push({x: this._x(x), y: this._y(y)});
      }
      arc(x, y, r, startA, endA) {
        let sweep = endA - startA;
        if (sweep < 0) sweep += Math.PI * 2;
        const circ = r * Math.abs(sweep);
        const steps = Math.max(1, Math.ceil(circ / 4));
        const cx = this._x(x);
        const cy = this._y(y);
        for(let i=0; i<=steps; i++) {
          const a = startA + sweep * (i/steps);
          this.currPath.push({x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r});
        }
      }
      ellipse(x, y, rx, ry, rot, startA, endA) {
        let sweep = endA - startA;
        const circ = Math.PI * (rx + ry) * (Math.abs(sweep)/(Math.PI*2));
        const steps = Math.max(1, Math.ceil(circ / 4));
        const cx = this._x(x);
        const cy = this._y(y);
        for(let i=0; i<=steps; i++) {
          const a = startA + sweep * (i/steps);
          const ex = Math.cos(a)*rx;
          const ey = Math.sin(a)*ry;
          this.currPath.push({
            x: cx + ex * Math.cos(rot) - ey * Math.sin(rot),
            y: cy + ex * Math.sin(rot) + ey * Math.cos(rot)
          });
        }
      }
      closePath() {
        if(this.currPath.length > 0) {
          this.currPath.push({x: this.currPath[0].x, y: this.currPath[0].y});
        }
      }
      stroke() {
        if(this.currPath.length > 0) this.subpaths.push(this.currPath);
        for(let path of this.subpaths) {
          for(let i=0; i<path.length-1; i++) {
             const p1 = path[i];
             const p2 = path[i+1];
             const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
             const steps = Math.max(1, Math.ceil(dist / 4));
             for(let j=0; j<steps; j++) {
                const x1 = p1.x + (p2.x - p1.x) * (j/steps);
                const y1 = p1.y + (p2.y - p1.y) * (j/steps);
                const x2 = p1.x + (p2.x - p1.x) * ((j+1)/steps);
                const y2 = p1.y + (p2.y - p1.y) * ((j+1)/steps);
                this.segments.push({ 
                  x1, y1, x2, y2, 
                  cx: (x1+x2)/2, cy: (y1+y2)/2, 
                  color: this.strokeStyle, width: this.lineWidth 
                });
             }
          }
        }
        this.beginPath();
      }
      fill() {
        if(this.currPath.length > 0) this.subpaths.push(this.currPath);
        for(let path of this.subpaths) {
          if(path.length > 1) {
            const center = path[0];
            for(let i=1; i<path.length-1; i++) {
               const p2 = path[i+1];
               this.segments.push({ 
                 x1: center.x, y1: center.y, x2: p2.x, y2: p2.y, 
                 cx: (center.x+p2.x)/2, cy: (center.y+p2.y)/2, 
                 color: this.fillStyle, width: this.lineWidth * 1.5 
               });
            }
          }
        }
        this.beginPath();
      }
      strokeRect(x, y, w, h) {
        this.beginPath();
        this.moveTo(x, y); this.lineTo(x+w, y); this.lineTo(x+w, y+h); this.lineTo(x, y+h); this.closePath();
        this.stroke();
      }
      fillRect(x, y, w, h) {
        const cx = this._x(x);
        const cy = this._y(y);
        this.segments.push({ 
          x1: cx, y1: cy+h/2, x2: cx+w, y2: cy+h/2, 
          cx: cx+w/2, cy: cy+h/2, color: this.fillStyle, width: h 
        });
      }
      clearRect() {}
    }

    const rand = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));
    const randChoice = arr => arr[Math.floor(Math.random() * arr.length)];
    const coinFlip = (prob = 0.5) => Math.random() < prob;

    function getStrokeColor() {
      const palette = colorPalette.value;
      if (palette === 'rainbow') {
        const hue = randInt(0, 360);
        const sat = randInt(85, 100);
        const light = isPaperMode ? randInt(25, 45) : randInt(55, 75);
        return `hsl(${hue}, ${sat}%, ${light}%)`;
      }
      if (isPaperMode) {
        switch (palette) {
          return '#1a4480';
        }
      } else {
        switch (palette) {
          case 'cyan': return '#66fcf1';
          case 'gold': return '#ffd700';
          case 'matrix': return '#00ff66';
          default: return '#e0e6ed';
        }
      }
    }

    function showControlsTemporarily() {
      controlsWrapper.classList.add('visible');
      clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(() => {
        controlsWrapper.classList.remove('visible');
      }, 2500);
    }

    window.addEventListener('mousemove', (e) => {
      if (e.clientY > window.innerHeight * 0.75) showControlsTemporarily();
    });
    controlsWrapper.addEventListener('mouseenter', () => {
      clearTimeout(autoHideTimer);
      controlsWrapper.classList.add('visible');
    });
    controlsWrapper.addEventListener('mouseleave', () => {
      autoHideTimer = setTimeout(() => controlsWrapper.classList.remove('visible'), 1000);
    });

    function drawSinglePattern(cx, cy, baseRadius) {
      const ctx = currentCtx;
      const strokeColor = getStrokeColor();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = strokeColor;
      ctx.fillStyle = strokeColor;
      ctx.lineCap = 'round';

      const coreType = randChoice(['concentric', 'eye', 'triangle', 'spiral']);
      
      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
      ctx.stroke();

      if (coreType === 'concentric') {
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 0.65, 0, Math.PI * 2);
        ctx.stroke();
        if (coinFlip(0.7)) {
          ctx.beginPath();
          ctx.arc(cx, cy, baseRadius * 0.35, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else if (coreType === 'eye') {
        const r = baseRadius * 0.8;
        ctx.beginPath();
        ctx.arc(cx - r * 0.5, cy, r, -Math.PI / 3, Math.PI / 3);
        ctx.arc(cx + r * 0.5, cy, r, Math.PI * 2 / 3, Math.PI * 4 / 3);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(cx, cy, r * 0.12, r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (coreType === 'triangle') {
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const a = (i * 2 * Math.PI / 3) - Math.PI / 2;
          const x = cx + Math.cos(a) * baseRadius;
          const y = cy + Math.sin(a) * baseRadius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 0.3, 0, Math.PI * 2);
        ctx.stroke();
      } else if (coreType === 'spiral') {
        ctx.beginPath();
        const a = 2, b = 6 * (baseRadius / 200); 
        for (let theta = 0; theta < Math.PI * 5; theta += 0.1) {
          const r = a + b * theta;
          const x = cx + r * Math.cos(theta);
          const y = cy + r * Math.sin(theta);
          if (theta === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      const numSpokes = randInt(2, 5);
      for (let i = 0; i < numSpokes; i++) {
        const angle = rand(0, Math.PI * 2);
        const len = baseRadius * rand(1.8, 2.5);
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(angle) * (len * rand(0.3, 0.8)), cy - Math.sin(angle) * (len * rand(0.3, 0.8)));
        ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
        ctx.stroke();

        if (coinFlip(0.6)) {
          const endX = cx + Math.cos(angle) * len;
          const endY = cy + Math.sin(angle) * len;
          const perpAngle = angle + Math.PI / 2;
          const barLen = rand(15, 30) * (baseRadius / 200);
          ctx.beginPath();
          ctx.moveTo(endX - Math.cos(perpAngle) * barLen, endY - Math.sin(perpAngle) * barLen);
          ctx.lineTo(endX + Math.cos(perpAngle) * barLen, endY + Math.sin(perpAngle) * barLen);
          ctx.stroke();
          if (coinFlip(0.4)) {
            const offset = 6 * (baseRadius / 200);
            const ox = Math.cos(angle) * offset;
            const oy = Math.sin(angle) * offset;
            ctx.beginPath();
            ctx.moveTo(endX + ox - Math.cos(perpAngle) * barLen, endY + oy - Math.sin(perpAngle) * barLen);
            ctx.lineTo(endX + ox + Math.cos(perpAngle) * barLen, endY + oy + Math.sin(perpAngle) * barLen);
            ctx.stroke();
          }
        }
      }

      const numSatellites = randInt(2, 5);
      for (let i = 0; i < numSatellites; i++) {
        const orbitAngle = rand(0, Math.PI * 2);
        const dist = baseRadius * rand(0.7, 1.8);
        const satRadius = rand(10, 35) * (baseRadius / 200);
        const sx = cx + Math.cos(orbitAngle) * dist;
        const sy = cy + Math.sin(orbitAngle) * dist;

        ctx.beginPath();
        ctx.arc(sx, sy, satRadius, 0, Math.PI * 2);
        ctx.stroke();

        if (coinFlip(0.7)) {
          const subType = randChoice(['concentric', 'bisection', 'inner-circle']);
          if (subType === 'concentric') {
            ctx.beginPath();
            ctx.arc(sx, sy, satRadius * 0.5, 0, Math.PI * 2);
            ctx.stroke();
          } else if (subType === 'bisection') {
            const cutA = rand(0, Math.PI * 2);
            ctx.beginPath();
            ctx.moveTo(sx - Math.cos(cutA) * satRadius, sy - Math.sin(cutA) * satRadius);
            ctx.lineTo(sx + Math.cos(cutA) * satRadius, sy + Math.sin(cutA) * satRadius);
            ctx.stroke();
          } else if (subType === 'inner-circle') {
            ctx.beginPath();
            ctx.arc(sx + satRadius * 0.3, sy, satRadius * 0.4, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      const numArcs = randInt(2, 5);
      for (let i = 0; i < numArcs; i++) {
        const r = baseRadius * rand(1.1, 2.2);
        const startA = rand(0, Math.PI * 2);
        const arcLength = rand(Math.PI * 0.2, Math.PI * 0.9);
        ctx.beginPath();
        ctx.arc(cx, cy, r, startA, startA + arcLength);
        ctx.stroke();
        if (coinFlip(0.6)) {
          drawGlyphStringOnArc(cx, cy, r + randChoice([-10, 10]), startA, startA + arcLength * 0.8, baseRadius);
        }
      }
    }

    function drawGlyphSymbol(x, y, size) {
      const ctx = currentCtx;
      ctx.save();
      ctx.translate(x, y);
      const hSize = size / 2;
      const pattern = randInt(0, 5);
      ctx.lineWidth = 1.2;
      if (pattern === 0) {
        ctx.strokeRect(-hSize, -hSize, size, size);
        ctx.fillRect(-1.5, -1.5, 3, 3);
      } else if (pattern === 1) {
        ctx.beginPath(); ctx.moveTo(-hSize, 0); ctx.lineTo(hSize, 0); ctx.moveTo(0, -hSize); ctx.lineTo(0, hSize); ctx.stroke();
        ctx.beginPath(); ctx.arc(-hSize/2, -hSize/2, 1.5, 0, Math.PI*2); ctx.arc(hSize/2, hSize/2, 1.5, 0, Math.PI*2); ctx.fill();
      } else if (pattern === 2) {
        ctx.beginPath(); ctx.moveTo(-hSize, -hSize); ctx.lineTo(hSize, hSize); ctx.moveTo(-hSize, hSize); ctx.lineTo(0, 0); ctx.stroke();
      } else if (pattern === 3) {
        ctx.beginPath(); ctx.arc(0, 0, hSize * 0.7, 0, Math.PI * 2); ctx.stroke(); ctx.fillRect(-1, -1, 2, 2);
      } else {
        ctx.beginPath(); ctx.moveTo(-hSize, -hSize); ctx.lineTo(hSize, -hSize); ctx.moveTo(0, -hSize); ctx.lineTo(0, hSize); ctx.stroke();
        ctx.fillRect(-hSize, hSize - 1.5, 3, 3);
      }
      ctx.restore();
    }

    function drawGlyphStringOnArc(cx, cy, radius, startAngle, endAngle, baseRadius) {
      const arcLen = (endAngle - startAngle) * radius;
      const step = 14 * (baseRadius / 200); 
      const count = Math.floor(arcLen / step);
      if (count <= 0) return;
      const angleStep = (endAngle - startAngle) / count;
      const size = 8 * (baseRadius / 200);
      for (let i = 0; i < count; i++) {
        const angle = startAngle + i * angleStep;
        drawGlyphSymbol(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius, size);
      }
    }

    function generateDiagram(origins) {
      const ctx = currentCtx;
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      if (origins.length > 1) {
        ctx.lineWidth = 2.0;
        ctx.strokeStyle = getStrokeColor();
        ctx.beginPath();
        ctx.moveTo(origins[0].x, origins[0].y);
        for(let i = 1; i < origins.length; i++) {
          ctx.lineTo(origins[i].x, origins[i].y);
        }
        if (origins.length > 2) {
          ctx.closePath();
        }
        ctx.stroke();
      }

      origins.forEach(origin => {
        const baseRadius = origins.length > 1 ? Math.min(w, h) * 0.08 : Math.min(w, h) * 0.22;
        drawSinglePattern(origin.x, origin.y, baseRadius);
      });
    }

    function triggerGeneration(origins = [{x: canvas.width / 2, y: canvas.height / 2}]) {
       const w = canvas.width;
       const h = canvas.height;
       
       if (animFrame) cancelAnimationFrame(animFrame);
       activeBots = [];
       
       offCanvas.width = w;
       offCanvas.height = h;

       const fakeCtx = new FakeCtx();
       currentCtx = fakeCtx;

       generateDiagram(origins);

       fakeCtx.segments.forEach(seg => {
          let minDist = Infinity;
          for(let o of origins) {
             const d = Math.hypot(seg.cx - o.x, seg.cy - o.y);
             if (d < minDist) minDist = d;
          }
          seg.dist = minDist;
       });
       sortedSegments = fakeCtx.segments.sort((a, b) => a.dist - b.dist);
       currentIndex = 0;

       offCtx.clearRect(0, 0, w, h);
       mainCtx.clearRect(0, 0, w, h);

       if (animToggle.checked) {
           drawAnimFrame();
       } else {
           sortedSegments.forEach(seg => {
               offCtx.beginPath();
               offCtx.moveTo(seg.x1, seg.y1);
               offCtx.lineTo(seg.x2, seg.y2);
               offCtx.strokeStyle = seg.color;
               offCtx.lineWidth = seg.width;
               offCtx.lineCap = 'round';
               offCtx.stroke();
           });
           mainCtx.drawImage(offCanvas, 0, 0);
       }
    }

    function drawAnimFrame() {
       const segmentsPerFrame = 12; 
       let newlyDrawn = [];

       for(let i=0; i<segmentsPerFrame; i++) {
           if(currentIndex < sortedSegments.length) {
               const seg = sortedSegments[currentIndex];
               
               offCtx.beginPath();
               offCtx.moveTo(seg.x1, seg.y1);
               offCtx.lineTo(seg.x2, seg.y2);
               offCtx.strokeStyle = seg.color;
               offCtx.lineWidth = seg.width;
               offCtx.lineCap = 'round';
               offCtx.stroke();
               
               newlyDrawn.push(seg);
               currentIndex++;
           }
       }

       mainCtx.clearRect(0, 0, canvas.width, canvas.height);
       mainCtx.drawImage(offCanvas, 0, 0);

       newlyDrawn.forEach(seg => {
           activeBots.push({ x: seg.cx, y: seg.cy, life: 1.0, color: seg.color });
       });

       for(let i=activeBots.length-1; i>=0; i--) {
           const bot = activeBots[i];
           bot.life -= 0.04; 
           if(bot.life <= 0) {
               activeBots.splice(i, 1);
           } else {
               mainCtx.fillStyle = bot.color;
               mainCtx.globalAlpha = bot.life;
               const size = Math.random() * 3 + 1.5;
               mainCtx.fillRect(bot.x - size/2, bot.y - size/2, size, size);
           }
       }
       mainCtx.globalAlpha = 1.0;

       if(currentIndex < sortedSegments.length || activeBots.length > 0) {
           animFrame = requestAnimationFrame(drawAnimFrame);
       }
    }

    function drawMarker(x, y) {
       mainCtx.beginPath();
       mainCtx.arc(x, y, 6, 0, Math.PI*2);
       mainCtx.fillStyle = isPaperMode ? '#d32f2f' : '#ff3366';
       mainCtx.fill();
       mainCtx.lineWidth = 2;
       mainCtx.strokeStyle = isPaperMode ? '#1a1a1a' : '#fff';
       mainCtx.stroke();
    }

    function prepareMode() {
      if (animFrame) cancelAnimationFrame(animFrame);
      mainCtx.clearRect(0, 0, canvas.width, canvas.height);
      clickedPoints = [];
      btnStartNodes.style.display = 'none';

      if (modeSelect.value === 'center') {
        btnGenerate.textContent = 'Generate New';
        timerControls.forEach(el => el.style.display = 'inline-block');
        resetTimer();
        triggerGeneration();
      } else {
        btnGenerate.textContent = 'Clear Canvas';
        timerControls.forEach(el => el.style.display = 'none');
        clearInterval(flashTimer);
      }
    }

    function resetTimer() {
      if (flashTimer) clearInterval(flashTimer);
      if (!pauseToggle.checked && modeSelect.value === 'center') {
        const interval = parseFloat(speedRange.value) * 1000;
        flashTimer = setInterval(() => triggerGeneration(), interval);
      }
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      if (modeSelect.value === 'center') {
        resetTimer(); 
        triggerGeneration([{x: clickX, y: clickY}]);
      } else {
        const requiredNodes = parseInt(modeSelect.value);
        if (clickedPoints.length < requiredNodes) {
          clickedPoints.push({x: clickX, y: clickY});
          drawMarker(clickX, clickY);
        }
        if (clickedPoints.length > 0) {
          btnStartNodes.style.display = 'inline-block';
        }
      }
    });

    btnStartNodes.addEventListener('click', () => {
      if (clickedPoints.length > 0) {
        btnStartNodes.style.display = 'none';
        triggerGeneration(clickedPoints);
        clickedPoints = [];
      }
    });

    btnGenerate.addEventListener('click', () => {
      if (modeSelect.value === 'center') {
        resetTimer();
        triggerGeneration();
      } else {
        prepareMode();
      }
    });

    modeSelect.addEventListener('change', prepareMode);
    speedRange.addEventListener('input', (e) => {
      speedVal.textContent = parseFloat(e.target.value).toFixed(1) + 's';
      resetTimer();
    });
    pauseToggle.addEventListener('change', resetTimer);
    colorPalette.addEventListener('change', () => { 
      if (modeSelect.value === 'center') { resetTimer(); triggerGeneration(); }
    });

    btnTheme.addEventListener('click', () => {
      isPaperMode = !isPaperMode;
      document.body.classList.toggle('paper-mode', isPaperMode);
      if (modeSelect.value === 'center') { resetTimer(); triggerGeneration(); }
    });

    prepareMode();
    showControlsTemporarily();
  </script>
</body>
</html>
